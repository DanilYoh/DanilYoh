<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Danil Yoh — Frontend Developer</title>
  <desc id="description">A dark modern banner with cyan and violet accents.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18" />
      <stop offset="0.55" stop-color="#10172a" />
      <stop offset="1" stop-color="#15112b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="cyan-glow">
      <stop stop-color="#22d3ee" stop-opacity="0.34" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#cbd5e1" stroke-opacity="0.055" />
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)" />
  <rect width="1200" height="360" rx="28" fill="url(#grid)" />
  <circle cx="1060" cy="42" r="280" fill="url(#violet-glow)" />
  <circle cx="870" cy="330" r="250" fill="url(#cyan-glow)" />

  <g opacity="0.95">
    <rect x="68" y="73" width="58" height="5" rx="2.5" fill="url(#accent)" />
    <text x="68" y="172" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">Danil Yoh</text>
    <text x="72" y="224" fill="#a5b4fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="5">FRONTEND DEVELOPER</text>
    <text x="72" y="280" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">React  ·  Next.js  ·  TypeScript</text>
  </g>

  <g transform="translate(820 88)">
    <circle cx="112" cy="92" r="104" fill="none" stroke="#67e8f9" stroke-opacity="0.16" />
    <circle cx="112" cy="92" r="72" fill="none" stroke="#a78bfa" stroke-opacity="0.22" />
    <path d="M70 52 30 92l40 40M154 52l40 40-40 40" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="m132 34-40 116" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
    <circle cx="112" cy="92" r="7" fill="#ffffff" filter="url(#soft-glow)" opacity="0.75" />
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
</svg>
